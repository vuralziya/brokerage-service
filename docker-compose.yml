version: "3.9"

services:
  db:
    image: couchbase
    ports:
      - "8091-8095:8091-8095"
      - "11210:11210"
    volumes:
      - "./wait-for-couchbase.sh:/wait-for-couchbase.sh"
    command:
      - /wait-for-couchbase.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://Administrator:password@localhost:8091/pools/default/buckets/default"]
      interval: 30s
      timeout: 10s
      retries: 5
  zookeeper:
    image: confluentinc/cp-zookeeper:5.1.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:5.1.2
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  brokerage-service:
    environment:
      - COUCHBASE_HOST=brokerage-service_db_1
    build: .
    depends_on:
      - db
      - kafka
    ports:
      - 8001:8001